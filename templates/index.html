{% extends "base.html" %}
{% block title %}ثبت‌نام مشتری — رای کیدز{% endblock %}
{% block content %}
<section class="hero">
    <h2>ثبت‌نام مشتری جدید</h2>
    <p>شماره موبایل مشتری را وارد کنید تا حساب ایجاد شود.</p>
</section>

{% if error %}
<div class="alert alert-error">{{ error }}</div>
{% endif %}

<div class="card">
    <h3>ثبت‌نام مشتری</h3>
    <form method="post" action="/customers">
        <div class="form-row">
            <div class="form-group">
                <label for="phone">شماره موبایل *</label>
                <input type="tel" id="phone" name="phone" placeholder="09123456789" required maxlength="11" pattern="09\d{9}">
            </div>
            <div class="form-group">
                <label for="first_name">نام</label>
                <input type="text" id="first_name" name="first_name" placeholder="نام">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="last_name">نام خانوادگی</label>
                <input type="text" id="last_name" name="last_name" placeholder="نام خانوادگی">
            </div>
            <div class="form-group">
                <label for="child_name">نام فرزند</label>
                <input type="text" id="child_name" name="child_name" placeholder="نام فرزند">
            </div>
        </div>
            <div class="form-group">
                <label for="child_birthday">تولد فرزند</label>
                <input type="text" id="child_birthday" name="child_birthday" placeholder="مثال: 1403/03/15"
                       class="persian-date-input">
                <small>تاریخ شمسی وارد کنید (برای تخفیف تولد)</small>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">ثبت‌نام</button>
    </form>
</div>

<div class="card">
    <h3>جستجوی مشتری</h3>
    <form method="get" action="/customers/lookup">
        <div class="form-group">
            <label for="lookup_phone">شماره موبایل</label>
            <input type="tel" id="lookup_phone" name="phone" placeholder="09123456789" required maxlength="11">
        </div>
        <button type="submit" class="btn btn-secondary">جستجو</button>
    </form>
</div>
{% endblock %}
